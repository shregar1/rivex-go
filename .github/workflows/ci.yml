name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go fmt ./...
      - run: go vet ./admin/... ./internal/ffi/...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./admin/... ./internal/ffi/...

  test:
    name: Test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shregar1/rivex-core
          path: core.rivex.vexarr.com
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core.rivex.vexarr.com
      - name: Build Rust core (librivex_ffi)
        working-directory: core.rivex.vexarr.com
        run: cargo build -p rivex-ffi --release
      - name: Copy library to Go SDK lib/
        run: |
          mkdir -p go.rivex.vexarr.com/lib
          OS="$(go env GOOS)"
          ARCH="$(go env GOARCH)"
          mkdir -p "go.rivex.vexarr.com/lib/${OS}_${ARCH}"
          cp "core.rivex.vexarr.com/target/release/librivex_ffi.a" \
             "go.rivex.vexarr.com/lib/${OS}_${ARCH}/librivex_ffi.a"
      - name: Copy C header
        run: |
          cp core.rivex.vexarr.com/crates/rivex-ffi/rivex_ffi.h \
             go.rivex.vexarr.com/include/rivex_ffi.h
      - name: Run tests
        working-directory: go.rivex.vexarr.com
        run: go test -race -v ./... 2>&1 | head -200

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build non-CGo packages
        run: go build ./admin/...
      - name: Verify examples compile
        run: |
          for d in examples/*/; do
            echo "Building $d..."
            (cd "$d" && go build -o /dev/null .) || true
          done
