<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivex Admin</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#0a0a0b;--surface:#141416;--surface2:#1c1c1f;
            --border:#2a2a2e;--text:#e4e4e7;--muted:#a1a1aa;
            --accent:#6366f1;--accent-hover:#818cf8;
            --green:#22c55e;--red:#ef4444;--yellow:#eab308;
            --radius:8px;--mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
            --sans:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
        }
        body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
        .layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
        .sidebar{
            background:var(--surface);border-right:1px solid var(--border);
            padding:24px 16px;display:flex;flex-direction:column;gap:4px;
        }
        .logo{font-family:var(--mono);font-size:13px;font-weight:800;letter-spacing:.1em;
               text-transform:uppercase;color:var(--accent);margin-bottom:24px;padding:0 12px}
        .nav-item{
            display:flex;align-items:center;gap:8px;padding:10px 12px;
            border-radius:var(--radius);font-size:14px;color:var(--muted);
            cursor:pointer;transition:.15s;text-decoration:none;
        }
        .nav-item:hover,.nav-item.active{background:var(--surface2);color:var(--text)}
        .nav-item.active{color:var(--accent)}
        .main{padding:32px 40px;overflow-y:auto}
        .header{margin-bottom:32px}
        .header h1{font-size:24px;font-weight:700;margin-bottom:4px}
        .header p{color:var(--muted);font-size:14px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:24px}
        .card{
            background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
            padding:20px;transition:.15s;
        }
        .card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
                     color:var(--muted);margin-bottom:12px}
        .card-value{font-size:28px;font-weight:700;font-family:var(--mono)}
        .card-value.green{color:var(--green)}
        .card-value.red{color:var(--red)}
        .card-value.yellow{color:var(--yellow)}
        .section{margin-bottom:32px}
        .section-title{font-size:16px;font-weight:600;margin-bottom:12px}
        .table{width:100%;border-collapse:collapse}
        .table th,.table td{
            text-align:left;padding:10px 12px;font-size:13px;
            border-bottom:1px solid var(--border);
        }
        .table th{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
        .table td{font-family:var(--mono);font-size:12px;word-break:break-all}
        .btn{
            display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
            border-radius:var(--radius);font-size:13px;font-weight:600;
            border:1px solid var(--border);background:var(--surface);color:var(--text);
            cursor:pointer;transition:.15s;
        }
        .btn:hover{background:var(--surface2);border-color:var(--accent)}
        .btn.danger:hover{border-color:var(--red);color:var(--red)}
        .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
        .btn.primary:hover{background:var(--accent-hover)}
        .badge{
            display:inline-block;padding:2px 8px;border-radius:999px;
            font-size:11px;font-weight:600;
        }
        .badge.green{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
        .badge.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
        .badge.yellow{background:color-mix(in srgb,var(--yellow) 15%,transparent);color:var(--yellow)}
        .action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
        .log-line{font-family:var(--mono);font-size:11px;padding:4px 0;border-bottom:1px solid var(--border)}
        .empty{color:var(--muted);font-size:13px;padding:24px;text-align:center}
        .toast{
            position:fixed;bottom:24px;right:24px;padding:12px 20px;
            border-radius:var(--radius);font-size:13px;font-weight:600;
            opacity:0;transition:.3s;z-index:100;
        }
        .toast.show{opacity:1}
        .toast.success{background:var(--green);color:#000}
        .toast.error{background:var(--red);color:#fff}
    </style>
</head>
<body>
<div class="layout">
    <nav class="sidebar">
        <div class="logo">Rivex Admin</div>
        <a class="nav-item active" href="#" hx-get="/admin/api/partials/overview" hx-target="#content" hx-push-url="false" onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
            <span>Overview</span>
        </a>
        <a class="nav-item" href="#" hx-get="/admin/api/partials/runtime" hx-target="#content" hx-push-url="false" onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
            <span>Runtime</span>
        </a>
        <a class="nav-item" href="#" hx-get="/admin/api/partials/config" hx-target="#content" hx-push-url="false" onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
            <span>Config</span>
        </a>
        <a class="nav-item" href="#" hx-get="/admin/api/partials/logs" hx-target="#content" hx-push-url="false" onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
            <span>Logs</span>
        </a>
        <a class="nav-item" href="#" hx-get="/admin/api/partials/actions" hx-target="#content" hx-push-url="false" onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
            <span>Actions</span>
        </a>
        <a class="nav-item" href="#" hx-get="/admin/api/partials/setup" hx-target="#content" hx-push-url="false" onclick="document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
            <span>Setup</span>
        </a>
    </nav>
    <main class="main">
        <div class="header">
            <h1>Dashboard</h1>
            <p id="subtitle">Loading...</p>
        </div>
        <div id="content" hx-get="/admin/api/partials/overview" hx-trigger="load">
            <div class="empty">Loading...</div>
        </div>
    </main>
</div>
<div id="toast" class="toast"></div>
<script>
    htmx.on("showToast", function(e) {
        var t = document.getElementById("toast");
        t.textContent = e.detail.value;
        t.className = "toast show " + (e.detail.type || "success");
        setTimeout(function(){t.classList.remove("show")}, 3000);
    });
</script>
</body>
</html>
